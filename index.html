<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS-LR</title>

<style>

body{
margin:0;
background:#050b15;
font-family:Segoe UI,Arial;
color:white;
}

header{
background:#08121f;
padding:20px;
text-align:center;
border-bottom:1px solid #00D4FF;
}

header h1{
margin:0;
color:#00D4FF;
}

.dashboard{
padding:15px;
}

.card{
background:#121f31;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 0 10px rgba(0,212,255,.2);
}

.avatar{
text-align:center;
font-size:80px;
}

.modules{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.module{
background:#1a2a40;
padding:15px;
border-radius:12px;
text-align:center;
cursor:pointer;
}

.module:hover{
background:#00D4FF;
color:black;
}

.voice{
text-align:center;
margin-top:20px;
}

.voice button{
width:100px;
height:100px;
border:none;
border-radius:50%;
font-size:40px;
background:#00D4FF;
cursor:pointer;
box-shadow:0 0 30px #00D4FF;
}

#response{
margin-top:15px;
background:#101d2b;
padding:15px;
border-radius:12px;
min-height:100px;
}

textarea{
width:100%;
height:90px;
background:#101d2b;
color:white;
border:none;
padding:10px;
border-radius:10px;
}

.action{
width:100%;
margin-top:10px;
padding:12px;
font-weight:bold;
background:#00D4FF;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>🤖 JARVIS-LR</h1>
<p>Luis R. Meléndez</p>
</header>

<div class="dashboard">

<div class="card">
<div class="avatar">🤖</div>

<h2>JARVIS PRIME</h2>

<p>
Buenas tardes Luis.<br>
Todos los sistemas operativos se encuentran operativos.
</p>
</div>

<div class="card">

<h3>Estado del Sistema</h3>

✅ Microsoft 365<br>
✅ Red<br>
✅ Seguridad<br>
🟡 Impresoras

</div>

<div class="card">

<h3>Módulos</h3>

<div class="modules">

<div class="module"
onclick="selectModule('IT')">
🔧 IT
</div>

<div class="module"
onclick="selectModule('AUTO')">
🚗 AUTO
</div>

<div class="module"
onclick="selectModule('EXEC')">
📧 EXEC
</div>
