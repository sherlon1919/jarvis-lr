<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS-LR v1.1</title><style>body{background:#050b15;color:#fff;font-family:Segoe UI;margin:0}header{text-align:center;padding:20px;border-bottom:1px solid #00d4ff}#clock{color:#00ffff;font-size:22px}.card{background:#121f31;margin:15px;padding:15px;border-radius:15px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{background:#1a2a40;padding:15px;border-radius:10px;cursor:pointer;text-align:center}button{padding:12px;border:none;border-radius:10px;background:#00d4ff}#response{min-height:100px}</style></head><body><header><h1>🤖 JARVIS-LR</h1><div id="clock"></div></header><div class="card"><h2>JARVIS PRIME</h2><p>Buenas tardes Luis.<br>Análisis finalizado.<br>Infraestructura, comunicaciones y servicios operando con normalidad.<br>Todos los sistemas están listos para operar.</p></div><div class="card"><div class="modules"><div class="module" onclick="selectModule('IT')">🔧 IT</div><div class="module" onclick="selectModule('AUTO')">🚗 AUTO</div><div class="module" onclick="selectModule('EXEC')">📧 EXEC</div></div></div><div class="card"><button id="voiceButton">🎙️ Activar JARVIS</button><div id="voiceStatus">En espera</div><select id="voiceSelector"></select></div><div class="card"><div id="response">Esperando instrucciones...</div></div><script>let availableVoices=[];function loadVoices(){availableVoices=speechSynthesis.getVoices();let s=document.getElementById('voiceSelector');s.innerHTML='';availableVoices.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=v.name+' - '+v.lang;s.appendChild(o)});let e=availableVoices.findIndex(v=>v.name.includes('Google español'));if(e>=0)s.value=e;}speechSynthesis.onvoiceschanged=loadVoices;function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';let v=availableVoices.find(x=>x.name.includes('Google español'));if(v)u.voice=v;speechSynthesis.speak(u);}function selectModule(m){document.getElementById('response').innerHTML='✅ Módulo seleccionado: '+m;speak('Módulo '+m+' activado');}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let r;if(SR){r=new SR();r.lang='es-ES';r.onstart=()=>voiceStatus.innerHTML='🟢 Escuchando';r.onend=()=>voiceStatus.innerHTML='🔵 En espera';r.onresult=e=>processCommand(e.results[0][0].transcript);}voiceButton.onclick=()=>{if(r)r.start();};function processCommand(c){c=c.toLowerCase();if(c.includes('hola jarvis')){let m='Buenas tardes Luis. Análisis finalizado. Infraestructura, comunicaciones y servicios operando con normalidad. Todos los sistemas están listos para operar.';response.innerHTML=m;speak(m);}}setInterval(()=>clock.innerHTML=new Date().toLocaleTimeString(),1000);loadVoices();</script></body></html>
